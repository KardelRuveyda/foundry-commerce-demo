<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2196F3"/></marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF9800"/></marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker>
    <marker id="arrPurpleS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#7B1FA2"/></marker>
    <linearGradient id="azBlue" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0A84D8"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="netPurple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#512BD4"/>
    </linearGradient>
    <symbol id="azTile" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="6" ry="6" fill="url(#azBlue)" stroke="#003F73"/>
    </symbol>
    <style>
      .ttl{font-size:18px;font-weight:700;fill:#0B3D91}
      .sub{font-size:12px;fill:#444}
      .ctnTitle{font-size:13px;font-weight:700}
      .lbl{font-size:11px;font-weight:700;fill:#212121}
      .sml{font-size:10px;fill:#212121}
      .iconLbl{font-size:10px;font-weight:700;fill:#0B3D91;text-anchor:middle}
    </style>
  </defs>

  <rect width="1400" height="800" fill="#FFFFFF"/>

  <!-- TITLE -->
  <text x="700" y="32" text-anchor="middle" class="ttl">Part 1: Cloud Infrastructure &amp; Connection Architecture</text>
  <text x="700" y="54" text-anchor="middle" class="sub">How .NET code connects to Microsoft Foundry</text>

  <!-- ===== LEFT — .NET Application container ===== -->
  <rect x="40" y="90" width="400" height="600" rx="10" ry="10" fill="#FFFFFF" stroke="#82B366" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="240" y="112" text-anchor="middle" class="ctnTitle" fill="#2E7D32">Your .NET Application</text>

  <!-- Box 1: .NET Console App -->
  <rect x="60" y="130" width="360" height="90" rx="8" ry="8" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <!-- .NET icon -->
  <g transform="translate(78,146)">
    <rect x="0" y="0" width="48" height="48" rx="8" ry="8" fill="url(#netPurple)"/>
    <text x="24" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">.NET</text>
  </g>
  <text x="140" y="166" class="lbl" fill="#1B5E20" font-size="13">.NET Console App</text>
  <text x="140" y="186" class="sml" fill="#33691E">Program.cs — Pipeline Orchestrator</text>

  <!-- Box 2: Microsoft.Agents.AI -->
  <rect x="60" y="240" width="360" height="90" rx="8" ry="8" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <!-- NuGet icon -->
  <g transform="translate(78,256)">
    <polygon points="24,2 46,14 46,38 24,46 2,38 2,14" fill="#004880" stroke="#003F73"/>
    <polygon points="24,8 40,16 40,34 24,40 8,34 8,16" fill="#0096D6"/>
    <text x="24" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NuGet</text>
  </g>
  <text x="140" y="276" class="lbl" fill="#1B5E20" font-size="13">Microsoft.Agents.AI</text>
  <text x="140" y="296" class="sml" fill="#33691E">Agent Framework v1.0 (GA)</text>

  <!-- Box 3: Microsoft.Extensions.AI -->
  <rect x="60" y="350" width="360" height="90" rx="8" ry="8" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <!-- Puzzle piece icon -->
  <g transform="translate(78,366)">
    <path d="M4,8 h14 v-2 a4,4 0 0 1 8,0 v2 h14 v14 h2 a4,4 0 0 1 0,8 h-2 v14 h-14 v-2 a4,4 0 0 0 -8,0 v2 h-14 v-14 h-2 a4,4 0 0 1 0,-8 h2 z" fill="#7B1FA2" stroke="#4A148C" stroke-width="1"/>
  </g>
  <text x="140" y="386" class="lbl" fill="#1B5E20" font-size="13">Microsoft.Extensions.AI</text>
  <text x="140" y="406" class="sml" fill="#33691E">IChatClient abstraction layer</text>

  <!-- Callout -->
  <rect x="60" y="480" width="360" height="100" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="74" y="504" font-size="12" font-weight="700" fill="#7F6000">✅ No API keys in code</text>
  <text x="74" y="528" font-size="12" font-weight="700" fill="#7F6000">✅ DefaultAzureCredential handles auth</text>
  <text x="74" y="552" font-size="12" font-weight="700" fill="#7F6000">✅ Same tools work on both paths</text>

  <!-- Bridge node IChatClient -->
  <rect x="170" y="610" width="140" height="50" rx="8" ry="8" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="2"/>
  <text x="240" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">IChatClient</text>

  <!-- ===== RIGHT TOP — Microsoft Foundry (Cloud) ===== -->
  <rect x="800" y="90" width="560" height="380" rx="10" ry="10" fill="#F0F7FF" stroke="#6C8EBF" stroke-width="2"/>
  <!-- Cloud glyph next to title -->
  <g transform="translate(820,98)">
    <path d="M14 18 a10 10 0 0 1 19 -3 a8 8 0 0 1 4 15 H10 a7 7 0 0 1 4 -12 z" fill="#DAE8FC" stroke="#6C8EBF"/>
  </g>
  <text x="1080" y="116" text-anchor="middle" class="ctnTitle" fill="#1A237E">Microsoft Foundry (Cloud)</text>
  <!-- Compliance badge -->
  <rect x="1200" y="100" width="150" height="22" rx="4" ry="4" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="1275" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#1B5E20">GDPR / KVKK Compliant</text>

  <!-- ROW 1 -->
  <!-- Foundry Project icon -->
  <g transform="translate(850,140)">
    <use href="#azTile" width="48" height="48"/>
    <circle cx="24" cy="24" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
    <line x1="24" y1="6" x2="24" y2="14" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="24" y1="34" x2="24" y2="42" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="6" y1="24" x2="14" y2="24" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="34" y1="24" x2="42" y2="24" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="908" y="160" class="lbl" fill="#0B3D91">Foundry Project</text>
  <text x="908" y="178" class="sml">admin-5418-resource</text>

  <!-- Entra ID icon -->
  <g transform="translate(1100,140)">
    <use href="#azTile" width="48" height="48"/>
    <path d="M24 10 L36 18 V32 C36 38 30 41 24 42 C18 41 12 38 12 32 V18 Z" fill="#FFFFFF"/>
    <path d="M24 14 L18 32 H22 L23 28 H25 L26 32 H30 L24 14 Z" fill="#005A9E"/>
  </g>
  <text x="1158" y="160" class="lbl" fill="#0B3D91">Microsoft Entra ID</text>
  <text x="1158" y="178" class="sml">DefaultAzureCredential</text>

  <!-- ROW 2 -->
  <!-- Azure OpenAI icon -->
  <g transform="translate(850,220)">
    <use href="#azTile" width="48" height="48"/>
    <circle cx="24" cy="24" r="13" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M16 24 q8 -10 16 0" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M16 24 q8 10 16 0" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <line x1="24" y1="11" x2="24" y2="37" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="908" y="240" class="lbl" fill="#0B3D91">Model: gpt-4.1-mini</text>
  <text x="908" y="258" class="sml">OpenAI-compatible endpoint</text>

  <!-- Foundry Agent Service -->
  <g transform="translate(1100,220)">
    <use href="#azTile" width="48" height="48"/>
    <circle cx="18" cy="20" r="6" fill="#FFFFFF"/>
    <circle cx="34" cy="20" r="6" fill="#FFFFFF"/>
    <rect x="12" y="28" width="24" height="14" rx="3" fill="#FFFFFF"/>
    <line x1="24" y1="14" x2="24" y2="6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="24" cy="5" r="2" fill="#FFFFFF"/>
  </g>
  <text x="1158" y="240" class="lbl" fill="#0B3D91">Foundry Agent Service</text>
  <text x="1158" y="258" class="sml">Managed hosting, scaling, identity</text>

  <!-- ROW 3 -->
  <!-- Azure Monitor -->
  <g transform="translate(850,300)">
    <use href="#azTile" width="48" height="48"/>
    <path d="M10 30 Q24 8 38 30" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <circle cx="38" cy="30" r="3" fill="#FFFFFF"/>
  </g>
  <text x="908" y="320" class="lbl" fill="#0B3D91">Observability</text>
  <text x="908" y="338" class="sml">Azure Monitor • OpenTelemetry traces</text>

  <!-- Azure Policy -->
  <g transform="translate(1100,300)">
    <use href="#azTile" width="48" height="48"/>
    <path d="M24 8 L38 14 V26 C38 34 32 40 24 42 C16 40 10 34 10 26 V14 Z" fill="#FFFFFF"/>
    <path d="M16 24 l6 6 l12 -14" stroke="#0078D4" stroke-width="2.5" fill="none"/>
  </g>
  <text x="1158" y="320" class="lbl" fill="#0B3D91">Governance</text>
  <text x="1158" y="338" class="sml">Azure Policy • RBAC, VNet, content safety</text>

  <!-- Key Vault row -->
  <g transform="translate(850,400)">
    <use href="#azTile" width="36" height="36"/>
    <rect x="14" y="16" width="9" height="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="11" y="22" width="15" height="9" fill="#FFFFFF"/>
    <circle cx="18.5" cy="26" r="1.5" fill="#005A9E"/>
  </g>
  <text x="896" y="422" font-size="10" fill="#212121">Azure Key Vault — secrets &amp; certificates (managed identity backed)</text>

  <!-- ===== RIGHT BOTTOM — Local Mode ===== -->
  <rect x="800" y="510" width="320" height="220" rx="10" ry="10" fill="#FFF8F0" stroke="#E8A33D" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="960" y="532" text-anchor="middle" class="ctnTitle" fill="#BF6A00">Local Mode</text>

  <!-- Ollama server icon -->
  <g transform="translate(820,548)">
    <rect x="0" y="0" width="40" height="14" rx="2" fill="#FFE0B2" stroke="#E65100"/>
    <rect x="0" y="18" width="40" height="14" rx="2" fill="#FFE0B2" stroke="#E65100"/>
    <rect x="0" y="36" width="40" height="14" rx="2" fill="#FFE0B2" stroke="#E65100"/>
    <circle cx="6" cy="7" r="1.5" fill="#4CAF50"/>
    <circle cx="6" cy="25" r="1.5" fill="#4CAF50"/>
    <circle cx="6" cy="43" r="1.5" fill="#4CAF50"/>
  </g>
  <text x="870" y="566" class="lbl" fill="#BF360C">Ollama Server</text>
  <text x="870" y="584" class="sml" fill="#5D4037">localhost:11434</text>

  <!-- Local model -->
  <g transform="translate(820,610)">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="#FFE0B2" stroke="#E65100"/>
    <circle cx="20" cy="20" r="10" fill="none" stroke="#E65100" stroke-width="2"/>
    <circle cx="20" cy="20" r="3" fill="#E65100"/>
  </g>
  <text x="870" y="628" class="lbl" fill="#BF360C">llama3.1 / phi3</text>
  <text x="870" y="646" class="sml" fill="#5D4037">Runs entirely on-premises</text>

  <!-- Shield -->
  <g transform="translate(820,670)">
    <path d="M20 0 L40 6 V22 C40 32 32 38 20 40 C8 38 0 32 0 22 V6 Z" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
    <path d="M10 20 l6 6 l14 -14" stroke="#E65100" stroke-width="2.5" fill="none"/>
  </g>
  <text x="870" y="688" class="lbl" fill="#BF360C">PCI-DSS Ready</text>
  <text x="870" y="706" class="sml" fill="#5D4037">Payment data never leaves</text>

  <!-- ===== EQUIVALENCE ARROW between containers ===== -->
  <line x1="1250" y1="470" x2="1250" y2="510" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrPurple)" marker-start="url(#arrPurpleS)"/>
  <rect x="1140" y="540" width="220" height="50" rx="6" ry="6" fill="#F3E5F5" stroke="#7B1FA2"/>
  <text x="1250" y="560" text-anchor="middle" font-size="10" font-weight="700" fill="#4A148C">Same AIAgent, same tools, same instructions</text>
  <text x="1250" y="578" text-anchor="middle" font-size="10" font-weight="700" fill="#4A148C">Only the IChatClient implementation changes</text>

  <!-- ===== PATH A — Cloud (blue solid, thick, orthogonal) ===== -->
  <polyline points="310,635 500,635 500,280 800,280" fill="none" stroke="#2196F3" stroke-width="4" marker-end="url(#arrBlue)"/>
  <rect x="540" y="262" width="220" height="22" rx="4" ry="4" fill="#FFFFFF" stroke="#2196F3"/>
  <text x="650" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0D47A1">Cloud Path — HTTP/REST</text>

  <!-- ===== PATH B — Local (orange dashed, thick, orthogonal) ===== -->
  <polyline points="310,635 500,635 500,620 800,620" fill="none" stroke="#FF9800" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#arrOrange)"/>
  <rect x="520" y="588" width="280" height="22" rx="4" ry="4" fill="#FFFFFF" stroke="#FF9800"/>
  <text x="660" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#BF6A00">Local Path — HTTP localhost:11434</text>

</svg>
